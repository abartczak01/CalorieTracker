<div class="container mt-3">
  <mat-card class="card" appearance="outlined">
    <mat-card-content>
      <h1>Page Not Found</h1>
      <p>Sorry, the page you are looking for does not exist.</p>
      <button
        mat-raised-button
        color="primary"
        class="go-back-button"
        (click)="goToHome()"
      >
        Go to Home Page
      </button>
    </mat-card-content>
  </mat-card>
</div>
