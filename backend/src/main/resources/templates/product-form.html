<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.id != null} ? 'Edit Product' : 'Add New Product'"></title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<a href="/web/products">< Back to Products</a>
<h1 th:text="${product.id != null} ? 'Edit Product' : 'Add New Product'"></h1>
<form th:action="${product.id != null} ? @{'/web/products/edit/' + ${product.id}} : @{'/web/products'}" method="post">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" th:value="${product.name}" required><br>
    <label for="kcal">Energy (kcal):</label>
    <input type="number" id="kcal" name="kcal" th:value="${product.kcal}" required><br>
    <label for="ingredients">Ingredients:</label>
    <input type="text" id="ingredients" name="ingredients" th:value="${product.ingredients}"><br>
    <label for="isVegan">Vegan:</label>
    <input type="hidden" name="isVegan" value="false">
    <input type="checkbox" id="isVegan" name="isVegan" th:checked="${product.isVegan}"><br>
    <label for="protein">Protein (g):</label>
    <input type="number" id="protein" name="protein" th:value="${product.protein}" step="0.1"><br>
    <label for="fat">Fat (g):</label>
    <input type="number" id="fat" name="fat" th:value="${product.fat}" step="0.1"><br>
    <label for="carbohydrate">Carbohydrates (g):</label>
    <input type="number" id="carbohydrate" name="carbohydrate" th:value="${product.carbohydrate}" step="0.1"><br>
    <label for="fiber">Fiber (g):</label>
    <input type="number" id="fiber" name="fiber" th:value="${product.fiber}" step="0.1"><br>
    <label for="sodium">Sodium (mg):</label>
    <input type="number" id="sodium" name="sodium" th:value="${product.sodium}"><br>
    <button type="submit" th:text="${product.id != null} ? 'Update' : 'Save'"></button>
</form>
</body>
</html>
